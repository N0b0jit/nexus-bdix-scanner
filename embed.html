<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus BDIX Scanner — Embed</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding-bottom: 0; }
        .container { padding: 1rem; }
        .creator-bar { position: static; margin-top: 0.8rem; }
        /* Hide heavy bits not needed in embed */
        .stats, .progress-wrap, .toolbar, .hint-line, footer, .bg-layer { display: none; }
        .embed-head { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; }
        .embed-head h1 { font-size: 1.4rem; }
        .embed-head .title-accent { font-size: 1.4rem; }
    </style>

    <!-- Vercel Analytics (static site snippet) -->
    <script>
      window.va = window.va || function () { (window.va.a = window.va.a || []).push(arguments); }
      window.va.l = Date.now();
    </script>
    <script src="/_vercel/insights/script.js" defer></script>
</head>
<body>
    <div class="bg-layer" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <div class="grid-noise"></div>
    </div>
    <main class="container">
        <header class="hero" style="margin-bottom:1rem;">
            <div class="embed-head">
                <h1 class="title">Nexus <span class="title-accent">BDIX Scanner</span></h1>
                <span class="stat-value mono" id="embedStatus">Idle</span>
            </div>
            <div class="creator-bar" id="creatorBar">
                <a class="creator-chip" href="https://t.me/n0b0jit_nexus" target="_blank" rel="noopener">
                    <span class="chip-ico">✈</span> Join @n0b0jit_nexus
                </a>
                <a class="creator-chip alt" href="https://linktr.ee/mr_nobojit.m" target="_blank" rel="noopener">
                    <span class="chip-ico">🔗</span> Linktree
                </a>
                <a class="creator-chip github" href="https://github.com/n0b0jit/nexus-bdix-scanner" target="_blank" rel="noopener" title="Star us on GitHub">
                    <span class="chip-ico">⭐</span> Star
                </a>
            </div>
            <div class="control actions" style="margin-top:0.8rem; justify-content:flex-start;">
                <button id="startStopBtn" class="btn btn-primary">Start Scan</button>
                <button id="resetBtn" class="btn btn-ghost">Reset</button>
                <span class="stat-label" style="margin-left:0.5rem;">Reachable: <b id="onlineCount">0</b> · Unreachable: <b id="offlineCount">0</b></span>
            </div>
        </header>

        <section class="results" aria-label="Scan results">
            <div class="results-col glass">
                <header class="results-head">
                    <h2 class="results-title online-title">Reachable</h2>
                    <span class="count-pill online-pill" id="onlinePill">0</span>
                </header>
                <ul id="urlList" class="url-list"></ul>
            </div>
            <div class="results-col glass">
                <header class="results-head">
                    <h2 class="results-title offline-title">Unreachable</h2>
                    <span class="count-pill offline-pill" id="offlinePill">0</span>
                </header>
                <ul id="urlList2" class="url-list"></ul>
            </div>
        </section>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
